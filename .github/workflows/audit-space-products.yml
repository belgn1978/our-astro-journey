name: Audit Hubble and JWST science products

on:
  push:
    paths:
      - 'scripts/audit-space-products.py'
      - '.github/workflows/audit-space-products.yml'
  workflow_dispatch:
    inputs:
      targets:
        description: "Maximum indexed targets to audit (1-100)"
        required: true
        default: "12"
      observations:
        description: "Maximum observation IDs per target (1-40)"
        required: true
        default: "12"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build current observation index
        run: python3 scripts/build-space-target-index.py --pages 4 --page-size 500
      - name: Audit public science products
        run: python3 scripts/audit-space-products.py --targets "${{ inputs.targets || '12' }}" --observations "${{ inputs.observations || '12' }}"
      - name: Verify generated audit artifacts
        run: |
          python3 -m json.tool assets/data/space-target-index.json > /dev/null
          python3 -m json.tool assets/data/space-product-audit.json > /dev/null
          python3 -c 'import json; d=json.load(open("assets/data/space-target-index.json")); assert d["schemaVersion"] >= 2 and any(t.get("observations") for t in d["targets"]), "Missing observation IDs"; a=json.load(open("assets/data/space-product-audit.json")); assert a["coverage"]["targetsChecked"] > 0, "No targets audited"; print("Audit validated:", a["coverage"]["targetsChecked"], "targets")'
      - name: Commit audit and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/space-target-index.json assets/data/space-product-audit.json
          git diff --cached --quiet || (git commit -m "Refresh science-product audit" && git push)
