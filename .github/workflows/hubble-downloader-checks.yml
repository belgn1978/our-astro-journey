name: Hubble downloader checks
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/hubble-product-basket-safety-20261122
    paths:
      - 'assets/js/data-finder-v8.js'
      - 'assets/js/fits-science.js'
      - 'tests/hubble-download.test.cjs'
      - 'tests/fits-zip.test.php'
      - 'tests/probe-pillars-mast.py'
      - 'tests/probe-live-pillars-php.php'
      - 'tests/probe-live-pillars-zip.php'
      - 'backend-ionos/test-download/**'
      - '.github/workflows/hubble-downloader-checks.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check assets/js/data-finder-v8.js && node --check assets/js/space-image-catalogue.js
      - name: Browser logic and FITS fixture regressions
        run: node tests/hubble-download.test.cjs
      - name: Validate PHP syntax
        run: php -l backend-ionos/test-download/index.php && php -l backend-ionos/test-download/FitsZip.php
      - name: Validate FITS ZIP fixture
        run: php tests/fits-zip.test.php /tmp/hubble-test-fits.zip
      - name: Install WCS validation dependency
        run: python3 -m pip install --user astropy
      - name: Inspect Pillars location and cross-filter WCS alignment
        run: python3 tests/probe-pillars-mast.py
      - name: Validate live MAST files with actual PHP ZIP backend inspector
        continue-on-error: true
        run: php tests/probe-live-pillars-php.php
      - name: End-to-end full three-channel FITS ZIP stream and CRC validation
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 12
        run: |
          php tests/probe-live-pillars-zip.php /tmp/pillars-live-processing.zip
          unzip -t /tmp/pillars-live-processing.zip
          unzip -Z1 /tmp/pillars-live-processing.zip
          rm -f /tmp/pillars-live-processing.zip
