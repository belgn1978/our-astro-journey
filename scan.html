<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070c1e">
<title>Connect with Our Astro Journey</title>
<meta name="description" content="Find Our Astro Journey on social media and explore our beginner-friendly astronomy website.">
<link rel="icon" href="/assets/images/branding/favicon-32x32.png">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f7ff;background:radial-gradient(ellipse at 50% 5%,#23365c 0%,#101a34 37%,#070c1e 80%);display:grid;place-items:center;padding:30px 18px}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(1px 1px at 15% 22%,white 99%,transparent),radial-gradient(1px 1px at 80% 15%,white 99%,transparent),radial-gradient(2px 2px at 65% 60%,white 99%,transparent),radial-gradient(1px 1px at 30% 82%,white 99%,transparent);background-size:210px 230px}.wrap{position:relative;width:min(100%,430px);text-align:center}.logo{width:min(82%,285px);height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 5px 22px #0008)}h1{font-size:clamp(1.55rem,6vw,2rem);margin:8px 0}p{color:#c5d1e9;line-height:1.55;margin:0 0 25px}.links{display:grid;gap:12px}.link{display:flex;align-items:center;justify-content:center;min-height:57px;padding:14px 18px;border:1px solid #60739a;border-radius:15px;background:#172747e8;color:#fff;text-decoration:none;font-size:1.05rem;font-weight:650;transition:transform .15s,background .15s}.link:hover,.link:focus-visible{background:#2a416d;transform:translateY(-2px)}.main{margin-top:10px;background:#70d5ff;color:#06172b;border-color:#70d5ff}.main:hover,.main:focus-visible{background:#a5e7ff}.small{font-size:.82rem;margin-top:24px;color:#aab9d3}a:focus-visible{outline:3px solid #fff;outline-offset:3px}.cookie-banner{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#101b32;color:#fff;padding:16px;box-shadow:0 -5px 20px #0008;text-align:left}.cookie-banner p{margin:7px 0}.cookie-banner a{color:#9cddff}.cookie-banner-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.cookie-banner button{padding:11px 16px;border:1px solid #9cddff;border-radius:9px;background:#23395f;color:white;cursor:pointer}
</style>
<script src="/assets/js/analytics-control.js?v=20261123-fix2"></script>
</head>
<body>
<main class="wrap">
<img class="logo" src="/assets/images/branding/logo.png" alt="Our Astro Journey logo" width="1408" height="768">
<h1>Join Our Astro Journey</h1>
<p>Discover the night sky with us. Follow our astrophotography, telescope reviews and beginner-friendly astronomy adventures.</p>
<nav class="links" aria-label="Our social media and website">
<a class="link" data-destination="tiktok" href="https://www.tiktok.com/@ourastrojourney">TikTok</a>
<a class="link" data-destination="instagram" href="https://www.instagram.com/our.astro.journey">Instagram</a>
<a class="link" data-destination="youtube" href="https://www.youtube.com/@OurAstroJourneyYT">YouTube</a>
<a class="link" data-destination="threads" href="https://www.threads.net/our.astro.journey">Threads</a>
<a class="link main" data-destination="website" href="/">Explore Our Website →</a>
</nav>
<p class="small">Clear skies and happy stargazing ✨</p>
</main>
<script>
(function(){
var params=new URLSearchParams(location.search);
var source=params.get('utm_source')||'direct';
document.querySelectorAll('[data-destination]').forEach(function(link){
link.addEventListener('click',function(){
if(typeof window.gtag==='function'&&!window.__OAJ_ANALYTICS_DISABLED__){
window.gtag('event','qr_landing_click',{destination:link.dataset.destination,qr_source:source});
}
});
});
})();
</script>
</body>
</html>
